<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Confirmación · XV Leah</title>


<style>

/* =====================================================
   FUENTES
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');


/* =====================================================
   COLORES
===================================================== */

:root {

    --azul-marino: #1C2F57;

    --azul-fondo: #06264B;

    --azul: #05308D;

    --dorado: #e6a945;

    --blanco: #FFFFFF;

    --texto-suave: rgba(255,255,255,0.88);

}


/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


html {
    min-height: 100%;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 35px 15px;

    font-family:
        'Lora',
        Georgia,
        serif;

    color: var(--blanco);

    /*
       FONDO DE LOS XV
       La imagen debe llamarse fondo.png
    */

    background-color:
        var(--azul-fondo);

    background-image:
        url("fondo.png");

    background-position:
        center top;

    background-repeat:
        no-repeat;

    /*
       Se adapta al ancho del celular
       sin deformar la imagen.
    */

    background-size:
        100% auto;

    position: relative;

    overflow-x: hidden;

}


/* =====================================================
   TARJETA
===================================================== */

.card {

    width: 100%;

    max-width: 430px;

    min-height: 650px;

    padding: 42px 28px 38px;

    text-align: center;

    position: relative;

    /*
       MUY TRANSPARENTE PARA DEJAR VER
       LAS FLORES DEL FONDO
    */

    background:
        rgba(6,38,75,0.18);

    border:
        1px solid
        rgba(230,169,69,0.60);

    border-radius: 4px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.20);

    overflow: hidden;

}


/* =====================================================
   BORDE INTERIOR
===================================================== */

.card::before {

    content: "";

    position: absolute;

    inset: 9px;

    border:
        1px solid
        rgba(230,169,69,0.20);

    pointer-events: none;

}


/* =====================================================
   DECORACIÓN SUPERIOR
===================================================== */

.top-decoration {

    font-family:
        'Playfair Display',
        serif;

    color:
        var(--dorado);

    font-size:
        17px;

    letter-spacing:
        6px;

    margin-bottom:
        17px;

}


/* =====================================================
   TEXTO PEQUEÑO
===================================================== */

.mini {

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        10px;

    font-weight:
        500;

    letter-spacing:
        3px;

    text-transform:
        uppercase;

    color:
        var(--blanco);

    opacity:
        0.95;

}


/* =====================================================
   TÍTULO
===================================================== */

h1 {

    margin:
        15px 0 7px;

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size:
        31px;

    line-height:
        1.2;

    font-weight:
        500;

    color:
        var(--blanco);

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.20);

}


/* =====================================================
   LÍNEA DORADA
===================================================== */

.gold-line {

    width:
        95px;

    height:
        1px;

    margin:
        15px auto 20px;

    background:
        var(--dorado);

    position:
        relative;

}


.gold-line::before {

    content:
        "◆";

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%, -50%);

    font-size:
        7px;

    color:
        var(--dorado);

    background:
        var(--azul-fondo);

    padding:
        0 7px;

}


/* =====================================================
   SALUDO
===================================================== */

.hello {

    margin:
        0 auto 30px;

    font-family:
        'Lora',
        Georgia,
        serif;

    font-size:
        19px;

    line-height:
        1.5;

    color:
        var(--texto-suave);

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.25);

}


/* =====================================================
   BLOQUE DE LUGARES
===================================================== */

.reserved {

    padding:
        25px 20px 23px;

    margin:
        0 auto;

    max-width:
        300px;

    /*
       BLANCO COMPLETAMENTE SÓLIDO
    */

    background:
        #FFFFFF;

    border:
        1px solid
        rgba(230,169,69,0.75);

    position:
        relative;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);

}


/* =====================================================
   DECORACIÓN DEL BLOQUE
===================================================== */

.reserved::before {

    content:
        "✦";

    position:
        absolute;

    top:
        -9px;

    left:
        50%;

    transform:
        translateX(-50%);

    background:
        #FFFFFF;

    padding:
        0 8px;

    color:
        var(--dorado);

    font-size:
        12px;

}


/* =====================================================
   NÚMERO DE LUGARES
===================================================== */

.number {

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size:
        50px;

    line-height:
        1;

    font-weight:
        500;

    color:
        var(--dorado);

}


/* =====================================================
   TEXTO DE LUGARES
===================================================== */

.label {

    margin-top:
        10px;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        10px;

    letter-spacing:
        1px;

    text-transform:
        uppercase;

    /*
       AZUL SOBRE BLANCO
    */

    color:
        var(--azul-marino);

    opacity:
        1;

}


/* =====================================================
   PREGUNTA
===================================================== */

.question {

    margin:
        34px 0 17px;

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size:
        20px;

    color:
        var(--blanco);

    text-shadow:
        0 2px 6px
        rgba(0,0,0,0.25);

}


/* =====================================================
   BOTONES
===================================================== */

.options {

    display:
        grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap:
        8px;

    max-width:
        320px;

    margin:
        0 auto;

}


/* =====================================================
   BOTÓN DE CANTIDAD
===================================================== */

.options button {

    padding:
        13px 5px;

    border:
        1px solid
        rgba(230,169,69,0.75);

    border-radius:
        2px;

    background:
        rgba(6,38,75,0.55);

    color:
        var(--blanco);

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        15px;

    font-weight:
        500;

    cursor:
        pointer;

    transition:
        all 0.2s ease;

}


/* =====================================================
   HOVER
===================================================== */

.options button:hover {

    background:
        rgba(230,169,69,0.18);

    border-color:
        var(--dorado);

    transform:
        translateY(-2px);

}


/* =====================================================
   SELECCIONADO
===================================================== */

.options button.selected {

    background:
        var(--dorado);

    color:
        var(--azul-marino);

    border-color:
        var(--dorado);

    font-weight:
        700;

}


/* =====================================================
   BOTÓN WHATSAPP
===================================================== */

.whatsapp {

    display:
        block;

    width:
        100%;

    max-width:
        300px;

    margin:
        27px auto 0;

    padding:
        15px 18px;

    border:
        1px solid
        var(--dorado);

    border-radius:
        3px;

    background:
        rgba(6,38,75,0.72);

    color:
        var(--blanco);

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        11px;

    font-weight:
        600;

    letter-spacing:
        0.7px;

    text-transform:
        uppercase;

    text-decoration:
        none;

    opacity:
        0.35;

    pointer-events:
        none;

    transition:
        all 0.25s ease;

}


/* =====================================================
   WHATSAPP ACTIVADO
===================================================== */

.whatsapp.enabled {

    opacity:
        1;

    pointer-events:
        auto;

}


.whatsapp.enabled:hover {

    background:
        var(--dorado);

    color:
        var(--azul-marino);

    box-shadow:
        0 8px 22px
        rgba(230,169,69,0.25);

}


/* =====================================================
   NOTA
===================================================== */

.note {

    margin-top:
        13px;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        9px;

    line-height:
        1.5;

    color:
        rgba(255,255,255,0.70);

}


/* =====================================================
   CORAZÓN
===================================================== */

.heart {

    margin-top:
        27px;

    color:
        var(--dorado);

    font-size:
        15px;

}


/* =====================================================
   ERROR
===================================================== */

.error {

    color:
        var(--dorado);

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        13px;

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    body {

        /*
           El fondo se mantiene pegado arriba
           y ocupa todo el ancho del celular.
        */

        background-size:
            100% auto;

        padding:
            25px 12px;

        align-items:
            flex-start;

    }


    .card {

        max-width:
            390px;

        min-height:
            650px;

        margin-top:
            15px;

        padding:
            38px 20px 32px;

        /*
           Un poco más transparente
           para que se vean las flores.
        */

        background:
            rgba(6,38,75,0.12);

    }


    h1 {

        font-size:
            28px;

    }


    .hello {

        font-size:
            17px;

    }


    .reserved {

        max-width:
            280px;

    }


    .number {

        font-size:
            45px;

    }


    .question {

        font-size:
            19px;

    }


    .options {

        max-width:
            280px;

        gap:
            6px;

    }


    .options button {

        padding:
            12px 3px;

        font-size:
            14px;

    }


    .whatsapp {

        max-width:
            280px;

    }

}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media (max-width: 380px) {

    body {

        padding:
            15px 8px;

    }


    .card {

        padding:
            35px 15px 28px;

    }


    .top-decoration {

        font-size:
            15px;

    }


    .mini {

        font-size:
            9px;

        letter-spacing:
            2.5px;

    }


    h1 {

        font-size:
            26px;

    }


    .hello {

        font-size:
            16px;

    }


    .reserved {

        max-width:
            260px;

    }


    .number {

        font-size:
            43px;

    }


    .question {

        font-size:
            18px;

    }


    .options {

        max-width:
            260px;

    }


    .options button {

        padding:
            11px 2px;

        font-size:
            13px;

    }


    .whatsapp {

        max-width:
            260px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =================================================
         DECORACIÓN
    ================================================== -->

    <div class="top-decoration">

        ✦　♡　✦

    </div>


    <!-- =================================================
         ENCABEZADO
    ================================================== -->

    <div class="mini">

        XV Leah · Confirmación

    </div>


    <h1 id="title">

        ¿Nos acompañarás?

    </h1>


    <div class="gold-line"></div>


    <p
        class="hello"
        id="hello">
    </p>



    <!-- =================================================
         LUGARES RESERVADOS
    ================================================== -->

    <div class="reserved">


        <div
            class="number"
            id="max">

            —

        </div>


        <div class="label">

            lugares reservados para ustedes

        </div>

    </div>



    <!-- =================================================
         PREGUNTA
    ================================================== -->

    <div class="question">

        ¿Cuántas personas asistirán?

    </div>



    <!-- =================================================
         BOTONES
    ================================================== -->

    <div
        class="options"
        id="options">
    </div>



    <!-- =================================================
         WHATSAPP
    ================================================== -->

    <a
        id="whatsapp"
        class="whatsapp"
        target="_blank"
        rel="noopener">

        Confirmar asistencia ♡

    </a>


    <div
        class="note"
        id="note">
    </div>


    <div class="heart">

        ♡

    </div>


</div>



<script>


/*
################################################################
################################################################

        ⭐⭐⭐  SOLO MODIFICA ESTA PARTE ⭐⭐⭐

################################################################
################################################################
*/


const INVITADOS = {


    "familia-perez": {

        nombre:
            "Familia Pérez",

        lugares:
            5

    },


    "familia-lopez": {

        nombre:
            "Familia López",

        lugares:
            2

    },


    "familia-cruz": {

        nombre:
            "Familia Cruz",

        lugares:
            4

    },


    "maria": {

        nombre:
            "María",

        lugares:
            1

    }


};


/*
################################################################
################################################################

        ⭐⭐⭐  NO MODIFIQUES NADA DE AQUÍ ABAJO ⭐⭐⭐

################################################################
################################################################
*/


const WHATSAPP =
    "50494921882";


const EVENTO =
    "los XV de Leah";


const parametros =
    new URLSearchParams(
        window.location.search
    );


const id =
    (
        parametros.get("id") || ""
    )
    .toLowerCase()
    .trim();


const invitado =
    INVITADOS[id];


const title =
    document.getElementById(
        "title"
    );


const hello =
    document.getElementById(
        "hello"
    );


const max =
    document.getElementById(
        "max"
    );


const options =
    document.getElementById(
        "options"
    );


const whatsapp =
    document.getElementById(
        "whatsapp"
    );


const note =
    document.getElementById(
        "note"
    );


if (invitado) {


    hello.textContent =
        `¡Hola, ${invitado.nombre}! 💙`;


    max.textContent =
        invitado.lugares;


    for (
        let i = 1;
        i <= invitado.lugares;
        i++
    ) {


        const boton =
            document.createElement(
                "button"
            );


        boton.textContent =
            i;


        boton.type =
            "button";


        boton.onclick =
            function() {


                document
                    .querySelectorAll(
                        ".options button"
                    )
                    .forEach(
                        function(b) {

                            b.classList.remove(
                                "selected"
                            );

                        }
                    );


                boton.classList.add(
                    "selected"
                );


                const personas =
                    i === 1
                        ? "persona"
                        : "personas";


                const mensaje =

                    `¡Hola! 💙 ` +

                    `Confirmo mi asistencia ` +

                    `a ${EVENTO}. ` +

                    `Asistiremos ${i} ${personas}. ` +

                    `Mi invitación tenía ` +

                    `${invitado.lugares} ` +

                    `lugares reservados. ` +

                    `Nombre: ${invitado.nombre}.`;


                whatsapp.href =

                    `https://wa.me/` +

                    `${WHATSAPP}` +

                    `?text=` +

                    encodeURIComponent(
                        mensaje
                    );


                whatsapp.classList.add(
                    "enabled"
                );


                note.textContent =

                    "Al tocar el botón se abrirá " +

                    "WhatsApp con el mensaje " +

                    "listo para enviar.";

            };


        options.appendChild(
            boton
        );

    }


}


else {


    title.textContent =
        "Enlace no encontrado";


    hello.innerHTML =

        '<span class="error">' +

        'Verifica que el enlace de ' +

        'confirmación sea correcto.' +

        '</span>';


    document
        .querySelector(
            ".reserved"
        )
        .style.display =
            "none";


    document
        .querySelector(
            ".question"
        )
        .style.display =
            "none";


    options.style.display =
        "none";


    whatsapp.style.display =
        "none";

}


</script>


</body>

</html>
