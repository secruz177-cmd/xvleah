<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Confirmación · XV Leah</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');
:root{--azul-marino:#1C2F57;--azul-fondo:#06264B;--dorado:#e6a945;--blanco:#fff;--texto-suave:rgba(255,255,255,.88)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--azul-fondo)}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:clamp(16px,3vw,40px);font-family:'Lora',Georgia,serif;color:var(--blanco);position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;background-color:var(--azul-fondo);background-image:url('./fondo.png?v=2');background-repeat:no-repeat;background-position:center top;background-size:cover}
.card{z-index:1;width:min(100%,460px);padding:clamp(30px,5vw,46px) clamp(18px,4vw,32px) clamp(28px,5vw,42px);text-align:center;position:relative;background:rgba(6,38,75,.16);border:1px solid rgba(230,169,69,.6);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(230,169,69,.2);pointer-events:none}
.top-decoration{font-family:'Playfair Display',serif;color:var(--dorado);font-size:17px;letter-spacing:6px;margin-bottom:17px}.mini{font-family:'Montserrat',Arial,sans-serif;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--blanco);opacity:.95}h1{margin:15px 0 7px;font-family:'Playfair Display',Georgia,serif;font-size:clamp(27px,5vw,31px);line-height:1.2;font-weight:500;color:var(--blanco);text-shadow:0 2px 8px rgba(0,0,0,.2)}
.gold-line{width:95px;height:1px;margin:15px auto 20px;background:var(--dorado);position:relative}.gold-line::before{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7px;color:var(--dorado);background:var(--azul-fondo);padding:0 7px}.hello{margin:0 auto 30px;font-family:'Lora',Georgia,serif;font-size:clamp(16px,4vw,19px);line-height:1.5;color:var(--texto-suave);text-shadow:0 2px 6px rgba(0,0,0,.25)}
.reserved{width:min(100%,300px);padding:25px 20px 23px;margin:0 auto;background:rgba(255,255,255,.28);border:1px solid rgba(230,169,69,.75);position:relative;box-shadow:0 8px 25px rgba(0,0,0,.12);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}.reserved::before{content:"✦";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:transparent;padding:0;color:var(--dorado);font-size:12px}.number{font-family:'Playfair Display',Georgia,serif;font-size:clamp(43px,10vw,50px);line-height:1;font-weight:500;color:var(--dorado);text-shadow:0 1px 3px rgba(0,0,0,.3)}.label{margin-top:10px;font-family:'Montserrat',Arial,sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dorado);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.question{margin:34px 0 17px;font-family:'Playfair Display',Georgia,serif;font-size:clamp(18px,4.5vw,20px);color:var(--blanco);text-shadow:0 2px 6px rgba(0,0,0,.25)}.options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(100%,320px);margin:0 auto}.options button{min-width:0;padding:13px 5px;border:1px solid rgba(230,169,69,.75);border-radius:2px;background:rgba(6,38,75,.55);color:var(--blanco);font-family:'Montserrat',Arial,sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s ease;touch-action:manipulation}.options button:hover{background:rgba(230,169,69,.18);border-color:var(--dorado);transform:translateY(-2px)}.options button.selected{background:var(--dorado);color:var(--azul-marino);border-color:var(--dorado);font-weight:700}.whatsapp{display:block;width:min(100%,300px);margin:27px auto 0;padding:15px 18px;border:1px solid var(--dorado);border-radius:3px;background:rgba(6,38,75,.72);color:var(--blanco);font-family:'Montserrat',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;text-decoration:none;opacity:.35;pointer-events:none;transition:all .25s ease;touch-action:manipulation}.whatsapp.enabled{opacity:1;pointer-events:auto}.whatsapp.enabled:hover{background:var(--dorado);color:var(--azul-marino);box-shadow:0 8px 22px rgba(230,169,69,.25)}.note{margin-top:13px;font-family:'Montserrat',Arial,sans-serif;font-size:9px;line-height:1.5;color:rgba(255,255,255,.7)}.heart{margin-top:27px;color:var(--dorado);font-size:15px}.error{color:var(--dorado);font-family:'Montserrat',Arial,sans-serif;font-size:13px}
@media (max-width:700px){body{align-items:flex-start;padding:18px 12px 24px}body::before{position:fixed;background-size:auto 100%;background-position:center center}.card{width:100%;max-width:420px;margin:8px auto 0;background:rgba(6,38,75,.12)}.options{gap:6px}.options button{padding:12px 3px;font-size:14px}}
@media (max-width:380px){body{padding:12px 8px 20px}.card{padding:32px 14px 26px;margin-top:4px}.top-decoration{font-size:15px;letter-spacing:5px}.mini{font-size:9px;letter-spacing:2.5px}.reserved{max-width:260px}.options{width:100%;gap:5px}.options button{padding:11px 2px;font-size:13px}.whatsapp{width:100%;max-width:260px}}
@media (min-width:701px) and (max-height:700px){body{align-items:flex-start}.card{margin:20px 0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="card"><div class="top-decoration">✦　♡　✦</div><div class="mini">XV Leah · Confirmación</div><h1 id="title">¿Nos acompañarás?</h1><div class="gold-line"></div><p class="hello" id="hello"></p><div class="reserved"><div class="number" id="max">—</div><div class="label">lugares reservados para ustedes</div></div><div class="question">¿Cuántas personas asistirán?</div><div class="options" id="options"></div><a id="whatsapp" class="whatsapp" target="_blank" rel="noopener">Confirmar asistencia ♡</a><div class="note" id="note"></div><div class="heart">♡</div></div>
<script>
const INVITADOS={"familia-perez":{nombre:"Familia Pérez",lugares:5},"familia-lopez":{nombre:"Familia López",lugares:2},"familia-cruz":{nombre:"Familia Cruz",lugares:4},"maria":{nombre:"María",lugares:1}};const WHATSAPP="50494921882";const EVENTO="los XV de Leah";const parametros=new URLSearchParams(window.location.search);const id=(parametros.get("id")||"").toLowerCase().trim();const invitado=INVITADOS[id];const title=document.getElementById("title"),hello=document.getElementById("hello"),max=document.getElementById("max"),options=document.getElementById("options"),whatsapp=document.getElementById("whatsapp"),note=document.getElementById("note");
if(invitado){hello.textContent=`¡Hola, ${invitado.nombre}! ♡ `;max.textContent=invitado.lugares;for(let i=1;i<=invitado.lugares;i++){const boton=document.createElement("button");boton.textContent=i;boton.type="button";boton.onclick=function(){document.querySelectorAll(".options button").forEach(b=>b.classList.remove("selected"));boton.classList.add("selected");const personas=i===1?"persona":"personas";const mensaje=`¡Hola! 💙 Confirmo mi asistencia a ${EVENTO}. Asistiremos ${i} ${personas}. Mi invitación tenía ${invitado.lugares} lugares reservados. Nombre: ${invitado.nombre}.`;whatsapp.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;whatsapp.classList.add("enabled");note.textContent="Al tocar el botón se abrirá WhatsApp con el mensaje listo para enviar."};options.appendChild(boton)}}else{title.textContent="Enlace no encontrado";hello.innerHTML='<span class="error">Verifica que el enlace de confirmación sea correcto.</span>';document.querySelector(".reserved").style.display="none";document.querySelector(".question").style.display="none";options.style.display="none";whatsapp.style.display="none"}
</script>
</body>
</html>
