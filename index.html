<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Confirmación · XV Leah</title>


<style>

/* =====================================================
   FUENTES
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');


/* =====================================================
   COLORES
===================================================== */

:root {

    --dorado: #e6a945;

    --azul-marino: #1c2f57;

    --azul: #05308d;

    --blanco: #ffffff;

    --crema: #fcfaf6;

    --gris: #6f7480;

}


/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    font-family:
        'Lora',
        Georgia,
        serif;

    background:

        radial-gradient(
            circle at top left,
            rgba(230,169,69,0.12),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(5,48,141,0.10),
            transparent 35%
        ),

        var(--crema);

    color: var(--azul-marino);

}


/* =====================================================
   TARJETA
===================================================== */

.card {

    width: 100%;

    max-width: 500px;

    background:
        rgba(255,255,255,0.98);

    border:
        1px solid
        rgba(230,169,69,0.35);

    border-radius: 26px;

    padding: 42px 30px 35px;

    text-align: center;

    position: relative;

    box-shadow:
        0 20px 60px
        rgba(28,47,87,0.13);

    overflow: hidden;

}


/* =====================================================
   DETALLE DORADO SUPERIOR
===================================================== */

.card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background:

        linear-gradient(
            90deg,
            var(--dorado),
            var(--azul),
            var(--dorado)
        );

}


/* =====================================================
   TEXTO SUPERIOR
===================================================== */

.mini {

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: var(--dorado);

    margin-bottom: 8px;

}


/* =====================================================
   TÍTULO
===================================================== */

h1 {

    margin:
        5px 0 12px;

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size: 34px;

    line-height: 1.15;

    font-weight: 600;

    color: var(--azul-marino);

}


/* =====================================================
   SALUDO
===================================================== */

.hello {

    margin:
        0 auto 28px;

    font-family:
        'Lora',
        Georgia,
        serif;

    font-size: 19px;

    line-height: 1.5;

    color: var(--azul);

}


/* =====================================================
   LUGARES RESERVADOS
===================================================== */

.reserved {

    padding: 23px 20px;

    border-radius: 20px;

    background:

        linear-gradient(
            135deg,
            #ffffff,
            #faf8f2
        );

    border:
        1px solid
        rgba(230,169,69,0.35);

    position: relative;

}


/* =====================================================
   DETALLE DORADO
===================================================== */

.reserved::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    transform:
        translateX(-50%);

    width: 55px;

    height: 3px;

    background:
        var(--dorado);

    border-radius:
        0 0 5px 5px;

}


/* =====================================================
   NÚMERO
===================================================== */

.number {

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size: 48px;

    font-weight: 600;

    line-height: 1;

    color:
        var(--azul);

}


/* =====================================================
   TEXTO LUGARES
===================================================== */

.label {

    margin-top: 9px;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size: 11px;

    font-weight: 500;

    letter-spacing: 0.5px;

    color:
        var(--gris);

}


/* =====================================================
   PREGUNTA
===================================================== */

.question {

    margin:
        30px 0 17px;

    font-family:
        'Playfair Display',
        Georgia,
        serif;

    font-size: 21px;

    font-weight: 500;

    color:
        var(--azul-marino);

}


/* =====================================================
   BOTONES
===================================================== */

.options {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 9px;

}


.options button {

    padding:
        13px 5px;

    border:
        1px solid
        rgba(28,47,87,0.20);

    border-radius:
        12px;

    background:
        #ffffff;

    color:
        var(--azul-marino);

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;

    transition:
        all 0.2s ease;

}


/* =====================================================
   BOTONES AL PASAR EL CURSOR
===================================================== */

.options button:hover {

    border-color:
        var(--dorado);

    color:
        var(--azul);

    transform:
        translateY(-2px);

    box-shadow:
        0 5px 12px
        rgba(230,169,69,0.15);

}


/* =====================================================
   BOTÓN SELECCIONADO
===================================================== */

.options button.selected {

    background:
        var(--azul-marino);

    color:
        var(--blanco);

    border-color:
        var(--azul-marino);

    box-shadow:
        0 6px 15px
        rgba(28,47,87,0.20);

}


/* =====================================================
   WHATSAPP
===================================================== */

.whatsapp {

    display:
        block;

    width:
        100%;

    margin-top:
        23px;

    padding:
        16px;

    border-radius:
        14px;

    background:
        var(--azul-marino);

    color:
        white;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-weight:
        600;

    font-size:
        14px;

    letter-spacing:
        0.2px;

    text-decoration:
        none;

    opacity:
        0.35;

    pointer-events:
        none;

    transition:
        all 0.2s ease;

}


/* =====================================================
   WHATSAPP ACTIVADO
===================================================== */

.whatsapp.enabled {

    opacity:
        1;

    pointer-events:
        auto;

}


.whatsapp.enabled:hover {

    background:
        var(--azul);

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 18px
        rgba(5,48,141,0.20);

}


/* =====================================================
   NOTA
===================================================== */

.note {

    margin-top:
        13px;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        10px;

    color:
        #858585;

    line-height:
        1.5;

}


/* =====================================================
   ERROR
===================================================== */

.error {

    color:
        #9b3348;

    font-family:
        'Montserrat',
        Arial,
        sans-serif;

    font-size:
        13px;

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 400px) {

    body {

        padding:
            15px;

    }


    .card {

        padding:
            38px 20px 30px;

        border-radius:
            23px;

    }


    h1 {

        font-size:
            29px;

    }


    .hello {

        font-size:
            17px;

    }


    .number {

        font-size:
            43px;

    }


    .question {

        font-size:
            19px;

    }


    .options {

        gap:
            6px;

    }


    .options button {

        padding:
            12px 4px;

        font-size:
            15px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =================================================
         ENCABEZADO
    ================================================== -->

    <div class="mini">

        XV Leah · Confirmación

    </div>


    <h1 id="title">

        ¡Nos encantará contar contigo!

    </h1>


    <p
        class="hello"
        id="hello">
    </p>



    <!-- =================================================
         LUGARES RESERVADOS
    ================================================== -->

    <div class="reserved">


        <div
            class="number"
            id="max">

            —

        </div>


        <div class="label">

            lugares reservados para ustedes

        </div>

    </div>



    <!-- =================================================
         PREGUNTA
    ================================================== -->

    <div class="question">

        ¿Cuántas personas asistirán?

    </div>



    <!-- =================================================
         BOTONES
    ================================================== -->

    <div
        class="options"
        id="options">
    </div>



    <!-- =================================================
         WHATSAPP
    ================================================== -->

    <a
        id="whatsapp"
        class="whatsapp"
        target="_blank"
        rel="noopener">

        Confirmar por WhatsApp

    </a>


    <div
        class="note"
        id="note">
    </div>


</div>



<script>


/*
################################################################
################################################################

        ⭐⭐⭐  SOLO MODIFICA ESTA PARTE ⭐⭐⭐

################################################################
################################################################


Aquí vas a colocar TODOS tus invitados.

Ejemplo:

"familia-perez": {

    nombre: "Familia Pérez",

    lugares: 5

}

El código será utilizado para crear
el enlace personalizado.


################################################################
*/


const INVITADOS = {


    "familia-perez": {

        nombre:
            "Familia Pérez",

        lugares:
            5

    },


    "familia-lopez": {

        nombre:
            "Familia López",

        lugares:
            2

    },


    "familia-cruz": {

        nombre:
            "Familia Cruz",

        lugares:
            4

    },


    "maria": {

        nombre:
            "María",

        lugares:
            1

    }


};


/*
################################################################
################################################################

        ⭐⭐⭐  NO MODIFIQUES NADA DE AQUÍ ABAJO ⭐⭐⭐

################################################################
################################################################
*/


/*
===============================================================
WHATSAPP
===============================================================
*/

const WHATSAPP =
    "50494921882";


/*
===============================================================
NOMBRE DEL EVENTO
===============================================================
*/

const EVENTO =
    "los XV de Leah";


/*
===============================================================
LEER EL CÓDIGO DEL INVITADO
===============================================================
*/

const parametros =
    new URLSearchParams(
        window.location.search
    );


const id =
    (
        parametros.get("id") || ""
    )
    .toLowerCase()
    .trim();


/*
===============================================================
BUSCAR INVITADO
===============================================================
*/

const invitado =
    INVITADOS[id];


/*
===============================================================
ELEMENTOS
===============================================================
*/

const title =
    document.getElementById(
        "title"
    );


const hello =
    document.getElementById(
        "hello"
    );


const max =
    document.getElementById(
        "max"
    );


const options =
    document.getElementById(
        "options"
    );


const whatsapp =
    document.getElementById(
        "whatsapp"
    );


const note =
    document.getElementById(
        "note"
    );


/*
===============================================================
COMPROBAR INVITADO
===============================================================
*/

if (invitado) {


    /*
    -----------------------------------------------------------
    SALUDO
    -----------------------------------------------------------
    */

    hello.textContent =
        `¡Hola, ${invitado.nombre}! 💜`;


    /*
    -----------------------------------------------------------
    MOSTRAR LUGARES
    -----------------------------------------------------------
    */

    max.textContent =
        invitado.lugares;



    /*
    -----------------------------------------------------------
    CREAR BOTONES
    -----------------------------------------------------------
    */

    for (
        let i = 1;
        i <= invitado.lugares;
        i++
    ) {


        const boton =
            document.createElement(
                "button"
            );


        boton.textContent =
            i;


        boton.type =
            "button";



        /*
        -------------------------------------------------------
        CUANDO EL INVITADO SELECCIONA
        -------------------------------------------------------
        */

        boton.onclick =
            function() {


                /*
                Quitar selección
                */

                document
                    .querySelectorAll(
                        ".options button"
                    )
                    .forEach(
                        function(b) {

                            b.classList.remove(
                                "selected"
                            );

                        }
                    );



                /*
                Marcar seleccionado
                */

                boton.classList.add(
                    "selected"
                );



                /*
                PERSONA / PERSONAS
                */

                const personas =
                    i === 1
                        ? "persona"
                        : "personas";



                /*
                MENSAJE WHATSAPP
                */

                const mensaje =

                    `¡Hola! 💜 ` +

                    `Confirmo mi asistencia ` +

                    `a ${EVENTO}. ` +

                    `Asistiremos ${i} ${personas}. ` +

                    `Mi invitación tenía ` +

                    `${invitado.lugares} ` +

                    `lugares reservados. ` +

                    `Nombre: ${invitado.nombre}.`;



                /*
                CREAR ENLACE WHATSAPP
                */

                whatsapp.href =

                    `https://wa.me/` +

                    `${WHATSAPP}` +

                    `?text=` +

                    encodeURIComponent(
                        mensaje
                    );



                /*
                ACTIVAR BOTÓN
                */

                whatsapp.classList.add(
                    "enabled"
                );



                /*
                MENSAJE DE AYUDA
                */

                note.textContent =

                    "Al tocar el botón se abrirá " +

                    "WhatsApp con el mensaje " +

                    "listo para enviar.";

            };


        /*
        -------------------------------------------------------
        AGREGAR BOTÓN
        -------------------------------------------------------
        */

        options.appendChild(
            boton
        );

    }


}


/*
################################################################
################################################################

                    INVITADO NO ENCONTRADO

################################################################
################################################################
*/

else {


    title.textContent =
        "Enlace no encontrado";


    hello.innerHTML =

        '<span class="error">' +

        'Verifica que el enlace de ' +

        'confirmación sea correcto.' +

        '</span>';



    document
        .querySelector(
            ".reserved"
        )
        .style.display =
            "none";


    document
        .querySelector(
            ".question"
        )
        .style.display =
            "none";


    options.style.display =
        "none";


    whatsapp.style.display =
        "none";

}


</script>


</body>

</html>
